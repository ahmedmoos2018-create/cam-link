<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cam-Link - مشاهدة البث</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 600px; margin: auto; }
        input { width: 90%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; text-align: center; margin-bottom: 15px; }
        button { background: #10b981; color: white; border: none; padding: 14px 20px; border-radius: 8px; font-size: 18px; cursor: pointer; width: 100%; font-weight: bold; }
        video { width: 100%; border-radius: 8px; margin-top: 15px; background: #000; min-height: 300px; }
        #status { margin-top: 15px; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Cam-Link 👁️</h2>
        <div id="input-section">
            <p>ادخل كود البث للمشاهدة:</p>
            <input type="text" id="peer-id-input" placeholder="ضع الكود هنا">
        </div>
        <button onclick="connectToStream()">📺 مشاهدة البث الآن</button>
        <div id="status"></div>
        <video id="remoteVideo" autoplay playsinline controls></video>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const peer = new Peer();

        if (roomId) {
            document.getElementById('input-section').style.display = 'none';
        }

        function connectToStream() {
            const targetId = roomId || document.getElementById('peer-id-input').value.trim();
            const statusDiv = document.getElementById('status');

            if (!targetId) {
                alert('يرجى إدخال كود البث أولاً');
                return;
            }

            statusDiv.innerText = '⏳ جاري الاتصال بالبث المباشر...';

            const call = peer.call(targetId, null);

            call.on('stream', (remoteStream) => {
                document.getElementById('remoteVideo').srcObject = remoteStream;
                statusDiv.innerText = '🟢 أنت تشاهد البث المباشر الآن!';
            });

            call.on('error', (err) => {
                statusDiv.innerText = '❌ تعذر الاتصال، تأكد أن صاحبك ما زال في صفحة البث.';
            });
        }

        // لو الرابط فيه روم جاهز اتصل أوتوماتيك
        peer.on('open', () => {
            if (roomId) {
                connectToStream();
            }
        });
    </script>
</body>
</html>
