<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cam-Link - مشاهدة البث</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 600px; margin: auto; }
        button { background: #10b981; color: white; border: none; padding: 14px 20px; border-radius: 8px; font-size: 18px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #059669; }
        video { width: 100%; border-radius: 8px; margin-top: 15px; background: #000; min-height: 300px; }
        #status { margin-top: 15px; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Cam-Link 👁️</h2>
        <p>اضغط للاتصال المباشر بكاميرا الموبايل دون حاجة لكود</p>
        <button onclick="connectToStream()">📺 مشاهدة البث الآن</button>
        <div id="status"></div>
        <video id="remoteVideo" autoplay playsinline controls></video>
    </div>

    <script>
        const ROOM_ID = "ahmed-cam-link-room-777";
        let peer;

        function connectToStream() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = '⏳ جاري الاتصال بالبث المباشر...';

            if (peer) peer.destroy();
            peer = new Peer();

            peer.on('open', () => {
                const call = peer.call(ROOM_ID, null);

                call.on('stream', (remoteStream) => {
                    document.getElementById('remoteVideo').srcObject = remoteStream;
                    statusDiv.innerText = '🟢 أنت تشاهد البث المباشر الآن!';
                });

                call.on('error', (err) => {
                    statusDiv.innerText = '❌ تعذر الاتصال، تأكد أن الموبايل ضغط على "بدء البث".';
                });
            });
        }
    </script>
</body>
</html>
