<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cam-Link - مشاهدة البث</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 600px; margin: auto; }
        video { width: 100%; border-radius: 8px; margin-top: 15px; background: #000; min-height: 300px; }
        #status { margin-top: 15px; font-weight: bold; font-size: 16px; color: #38bdf8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Cam-Link 👁️</h2>
        <div id="status">⏳ جاري الاتصال بالسيرفر...</div>
        <video id="remoteVideo" autoplay playsinline controls></video>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');

        const peerConfig = {
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' }
                ]
            }
        };

        const peer = new Peer(peerConfig);

        peer.on('open', () => {
            const statusDiv = document.getElementById('status');
            if (!roomId) {
                statusDiv.innerText = '❌ الرابط غير مكتمل، يرجى فتح الرابط المنسوخ من الموبايل.';
                return;
            }

            statusDiv.innerText = '⏳ جاري الربط مع الموبايل...';
            const call = peer.call(roomId, null);

            call.on('stream', (remoteStream) => {
                document.getElementById('remoteVideo').srcObject = remoteStream;
                statusDiv.innerText = '🟢 البث شغال الآن بنجاح!';
            });

            call.on('error', (err) => {
                statusDiv.innerText = '❌ تعذر الاتصال، تأكد أن الموبايل ما زال فاتحاً لصفحة البث.';
            });
        });
    </script>
</body>
</html>
