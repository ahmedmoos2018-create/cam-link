<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cam-Link - مشاهدة البث</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 500px; margin: auto; }
        input { width: 90%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; text-align: center; margin-bottom: 15px; }
        button { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 95%; font-weight: bold; }
        button:hover { background: #1d4ed8; }
        video { width: 100%; border-radius: 8px; margin-top: 15px; background: #000; min-height: 250px; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Cam-Link 👁️</h2>
        <p>ادخل كود البث لمشاهدة الكاميرا:</p>
        <input type="text" id="peer-id-input" placeholder="حط الكود هنا">
        <br>
        <button onclick="connectToPeer()">مشاهدة البث المباشر</button>
        <div id="status"></div>
        <video id="remoteVideo" autoplay playsinline controls></video>
    </div>

    <script>
        const peer = new Peer();

        function connectToPeer() {
            const remoteId = document.getElementById('peer-id-input').value.trim();
            const statusDiv = document.getElementById('status');

            if (!remoteId) {
                alert('يرجى كتابة أو لصق الكود أولاً');
                return;
            }

            statusDiv.innerText = '⏳ جاري الاتصال...';

            const call = peer.call(remoteId, null);

            call.on('stream', (remoteStream) => {
                document.getElementById('remoteVideo').srcObject = remoteStream;
                statusDiv.innerText = '🟢 أنت تشاهد البث الآن!';
            });

            call.on('error', (err) => {
                statusDiv.innerText = '❌ تعذر الاتصال، تأكد من الكود أو أن البث يعمل.';
            });
        }
    </script>
</body>
</html>
