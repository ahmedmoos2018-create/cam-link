<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cam-Link - بث الكاميرا</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 400px; margin: auto; }
        button { background: #2563eb; color: white; border: none; padding: 14px 20px; border-radius: 8px; font-size: 18px; cursor: pointer; width: 100%; font-weight: bold; }
        video { width: 100%; border-radius: 8px; margin-top: 15px; background: #000; }
        #status { margin-top: 15px; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Cam-Link 🎥</h2>
        <p>اضغط لبدء البث المباشر تلقائياً</p>
        <button onclick="startStream()">🔴 بدء البث الأن</button>
        <div id="status"></div>
        <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <script>
        const ROOM_ID = "ahmed-cam-link-room-777"; // معرف الغرفة الثابت
        let peer;
        let localStream;

        async function startStream() {
            const statusDiv = document.getElementById('status');
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                
                statusDiv.innerText = '⏳ جاري تجهيز الغرفة...';

                // الاتصال بمعرف الغرفة الثابت
                peer = new Peer(ROOM_ID);

                peer.on('open', (id) => {
                    statusDiv.innerText = '🟢 البث مباشر الآن! افتح اللابتوب للمشاهدة مباشرة.';
                });

                peer.on('call', (call) => {
                    call.answer(localStream);
                    statusDiv.innerText = '🔵 اللابتوب متصل الآن ويشاهد البث!';
                });

                peer.on('error', (err) => {
                    if (err.type === 'unavailable-id') {
                        statusDiv.innerText = '🟢 البث شغال بالفعل ومستعد للاتصال!';
                    } else {
                        statusDiv.innerText = '❌ حدث خطأ، يرجى إغلاق الصفحة وإعادة فتحها.';
                    }
                });

            } catch (err) {
                alert('يرجى السماح بالوصول للكاميرا والمايك');
            }
        }
    </script>
</body>
</html>س
